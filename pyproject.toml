[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymimus"
version = "0.1.0"
description = "Offline multilingual speech transcription CLI powered by faster-whisper"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "jeorgexyz", email = "andertech.innovations@gmail.com" }]
keywords = ["speech-to-text", "transcription", "whisper", "faster-whisper", "offline", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/jeorgexyz/polymimus"
Issues = "https://github.com/jeorgexyz/polymimus/issues"

[project.scripts]
polymimus = "polymimus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["polymimus"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
