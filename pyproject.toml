[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymimus"
version = "0.1.0"
description = "Local multilingual speech transcription"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10",
]

[project.scripts]
polymimus = "polymimus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["polymimus"]
